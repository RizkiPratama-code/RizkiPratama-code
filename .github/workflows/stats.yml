name: Update README cards

on:
  schedule:
    - cron: "0 0 * * *" # Berjalan otomatis setiap tengah malam
  workflow_dispatch: # Memungkinkan kamu menjalankan manual kapan saja

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Wajib agar bisa menyimpan file ke repo

    steps:
      - uses: actions/checkout@v4 # Mengambil kode repo kamu

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=RizkiPratama-code&show_icons=true&theme=tokyonight
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=RizkiPratama-code&layout=compact&langs_count=6&theme=radical
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update README cards" || exit 0
          git push
