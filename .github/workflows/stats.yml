name: Generate stats card

on:
  schedule:
    - cron: "0 */12 * * *" # Berjalan setiap 12 jam
  workflow_dispatch: # Agar bisa dijalankan manual
  push:
    branches:
      - main # Berjalan setiap kamu push ke main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: generate stats.svg
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: stats
          # Username sudah saya sesuaikan dengan milikmu
          options: username=RizkiPratama-code&show_icons=true&include_all_commits=true&count_private=true&theme=dracula
          path: dist/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: push stats.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: stats-output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
